# ============================================================
# docker-compose.yml — Cloud Resource Benchmark
# ============================================================
# Start the entire application with:
#   docker compose up --build
#
# Stop with:
#   docker compose down
#
# Wipe data volumes with:
#   docker compose down -v
# ============================================================

version: "3.9"

services:

  # ---------------------------------------------------------- #
  # PostgreSQL database                                          #
  # ---------------------------------------------------------- #
  db:
    image: postgres:16-alpine
    container_name: benchmark_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB:       ${DB_NAME:-benchmark_db}
      POSTGRES_USER:     ${DB_USER:-benchmark_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # Required — set in .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-benchmark_user} -d ${DB_NAME:-benchmark_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benchmark_net

  # ---------------------------------------------------------- #
  # Redis cache layer                                            #
  # ---------------------------------------------------------- #
  cache:
    image: redis:7-alpine
    container_name: benchmark_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benchmark_net

  # ---------------------------------------------------------- #
  # Flask application                                            #
  # ---------------------------------------------------------- #
  web:
    build: .
    container_name: benchmark_web
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Override DB_HOST and REDIS_HOST so Flask connects to compose services
      DB_HOST: db
      REDIS_HOST: cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - benchmark_net

# ---------------------------------------------------------- #
# Volumes & Networks                                           #
# ---------------------------------------------------------- #
volumes:
  pg_data:
    name: benchmark_pg_data

networks:
  benchmark_net:
    name: benchmark_network
    driver: bridge
